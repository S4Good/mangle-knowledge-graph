name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go mod download
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: go build -o bin/kg ./cmd/kg
      - name: Smoke test binary and embedded data
        run: |
          ./bin/kg deps helm | grep -Fx 'depends_on(/helm,/linux)'
          ./bin/kg impact linux | grep -Fx 'impacted_by(/linux,/helm)'
          ./bin/kg explain helm linux | grep -F '[EDB]'
          cd /tmp
          "$GITHUB_WORKSPACE/bin/kg" list | grep -Fx '/git'
